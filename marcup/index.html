<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Петров Руслан</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="container">
    <header class="header">
      <h1>Список задач</h1>
    </header>

    <main class="board-container">
      <section class="add-task__form">
        <label for="newTaskInput">Новая задача:</label>
        <div class="add-task__input-wrapper">
          <input type="text" id="newTaskInput" placeholder="Введите название задачи..." />
          <button id="addTaskBtn">+ Добавить</button>
        </div>
      </section>

      <div class="task-board">
        <div class="column backlog" data-status="backlog">
          <div class="column-title">Бэклог</div>
          <div class="task-list" id="backlog-tasks">
            <div class="task">Выучить JS</div>
            <div class="task">Выучить React</div>
            <div class="task">Сделать домашку</div>
          </div>
        </div>

        <div class="column processing" data-status="processing">
          <div class="column-title">В процессе</div>
          <div class="task-list" id="processing-tasks">
            <div class="task">Выпить соку</div>
            <div class="task">Попить воды</div>
          </div>
        </div>

        <div class="column done" data-status="done">
          <div class="column-title">Готово</div>
          <div class="task-list" id="done-tasks">
            <div class="task">Позвонить маме</div>
            <div class="task">Погладить кота</div>
          </div>
        </div>

        <div class="column trash" data-status="trash">
          <div class="column-title">Корзина</div>
          <div class="task-list" id="trash-tasks">
            <div class="task">Сходить погулять</div>
            <div class="task">Прочитать Войну и Мир</div>
          </div>
          <button class="delate-btn">✖ Очистить</button>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
